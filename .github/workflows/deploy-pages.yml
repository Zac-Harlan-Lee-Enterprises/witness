# Deploy to GitHub Pages — automatic on main, only after CI passes.
#
# Merging (or pushing) to main is the decision to publish. When CI finishes on
# a push to main, this workflow deploys that exact commit if CI succeeded; a
# failed or cancelled CI run deploys nothing.
# It can also be re-run by hand from the Actions tab on main.
#
# Guards (workflow_run runs with this repo's permissions, so be strict):
# - the job is pinned to main BY REF;
# - the CI run must be a `push` to main in THIS repository (a fork's pull
#   request from a branch named "main" also reports head_branch == 'main');
# - it checks out the commit CI tested, not whatever main is by now.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:ui
      - name: Build for a project sub-path
        run: npm run build
        env:
          # https://<owner>.github.io/<repo>/ — see docs/deployment.md
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
