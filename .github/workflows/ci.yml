# CI — the self-enforcing half of the harness. Runs on every pull request and
# on pushes to main. A PR with a failing required check is not releasable.
# The job name `build-and-test` is the required status check (harden-github.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A run takes about 45 minutes since the chapters grew (each playthrough is
    # 6-10 minutes on a runner); shared runners are sometimes half again as
    # slow, and a failing test is retried once.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit, integration, content and architecture tests
        run: npm run test:unit

      - name: React component tests
        run: npm run test:ui

      - name: Content and schema validation
        run: npm run content:validate

      - name: Dead code check
        run: npm run deadcode

      - name: Production build
        run: npx vite build

      - name: Harness drift sweep
        run: bash quality-sweep.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop, phone, tablet)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
